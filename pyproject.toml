[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenRelTime-Studio"
version = "0.1.0"
description = "OpenRelTime Studio: native desktop GUI for OpenRelTime relative-rate dating (bilingual, light/dark)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "曾子超", email = "zengzichao@sjtu.edu.cn" },
]
keywords = [
    "molecular dating",
    "phylogenetics",
    "RelTime",
    "relative rate framework",
    "timetree",
    "gui",
    "pyside6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Desktop Environment",
]
dependencies = [
    # Runtime dependency on the engine project.  Studio talks to OpenRelTime
    # through its public Python API only, so the engine is an installed
    # requirement, never a vendored or path-based checkout.
    "openreltime[plot]>=0.1.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
openreltime-studio = "openreltime_studio:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/OpenRelTime-Studio"
Documentation = "https://github.com/ZengZichao/OpenRelTime-Studio/tree/main/docs"
Changelog = "https://github.com/ZengZichao/OpenRelTime-Studio/blob/main/CHANGELOG.md"
Source = "https://github.com/ZengZichao/OpenRelTime-Studio"
Issues = "https://github.com/ZengZichao/OpenRelTime-Studio/issues"
"Engine (OpenRelTime)" = "https://github.com/ZengZichao/OpenRelTime"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openreltime_studio*"]

[tool.setuptools.package-data]
openreltime_studio = [
    "locales/*.json",
    "locales/*/*.json",
    "resources/icons/*.svg",
    "examples/*.nwk",
    "examples/*.tsv",
    "examples/*.md",
    "resources/*.png",
    "resources/*.icns",
    "resources/*.spec",
]

[tool.pytest.ini_options]
testpaths = ["openreltime_studio/tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
